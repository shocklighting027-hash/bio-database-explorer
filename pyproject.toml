[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-database-explorer"
version = "0.1.0"
description = "A reproducible NCBI and UniProt workflow for exploring human gene families."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ilya" }]
dependencies = [
    "biopython>=1.85,<2",
    "pandas>=2.2,<4",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29,<8",
    "jupyter>=1.1,<2",
    "openpyxl>=3.1,<4",
]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
bio-db = "bio_database_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

